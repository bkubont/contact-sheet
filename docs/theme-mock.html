<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
.t{--paper:#FAF8F3;--surface:#fff;--ink:#0A1A4A;--royal:#0F2A7A;--royal-bright:#1E46C0;--gold:#C9962E;--gold-soft:#FBF3E0;--line:#E7E2D6;--muted:#646B80;--chip:#F1EEE6}
.t.dark{--paper:#070E24;--surface:#0D1834;--ink:#E6EBF7;--royal:#2B55D6;--royal-bright:#7FA0F0;--gold:#D4A53A;--gold-soft:#1C1A12;--line:#1D2A4D;--muted:#8D97B3;--chip:#14214A}
body{margin:0;display:flex;gap:24px;padding:24px;background:#d8d8d8;font-family:Outfit,sans-serif}
.t{width:390px;height:780px;background:var(--paper);color:var(--ink);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 10px 40px #0003}
.top{padding:18px 16px 8px;border-bottom:1px solid var(--line);background:var(--paper)}
.row1{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:#000 url(../app/public/romulus-logo.jpg) center/cover}
h1{flex:1;margin:0;font:600 1.5rem Fraunces,serif;letter-spacing:-.02em}
.sel{font-weight:600;color:var(--royal-bright);font-size:.95rem}
.plus{width:38px;height:38px;border-radius:50%;background:var(--royal);color:#fff;display:grid;place-items:center;font-size:24px;line-height:1}
.search{margin-top:12px;background:var(--chip);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.95rem}
.chips{display:flex;gap:6px;padding:12px 0 6px;flex-wrap:nowrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:6px;background:var(--surface);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{background:var(--tint);color:var(--tink);border-color:var(--tink)}
.letter{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--gold);padding:14px 20px 6px}
.group{background:var(--surface);margin:0 12px;border-radius:14px;border:1px solid var(--line)}
.r{display:flex;align-items:center;padding:11px 14px;gap:12px;border-bottom:1px solid var(--line)}
.r:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--royal-bright)}
.nm{font-weight:600}.mt{color:var(--muted);font-size:.85rem}
.dots{margin-left:auto;display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%}
.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--paper);padding:8px 0 18px}
.tab{text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);position:relative;padding-top:8px}
.tab b{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:6px;border:2px solid currentColor;opacity:.8}
.tab.on{color:var(--ink)}.tab.on::before{content:"";position:absolute;top:-9px;left:30%;right:30%;height:2px;background:var(--gold);border-radius:2px}
</style></head><body>
<script>
const tags={Family:['#4A6FB5','#E3EAF7','#2B4C8C'],School:['#3C8C86','#DDF0EE','#21615C'],Church:['#8A6BB0','#EEE7F6','#5E4485'],Golf:['#6E8B4E','#E8F0DF','#4A6232'],Work:['#B5643F','#F7E6DD','#8A4426'],Neighbors:['#B55A78','#F6E3EA','#8B3B58']};
const darkT={Family:['#7C9BE0','#16264A','#B8CCF5'],School:['#5FC1B8','#0F2E33','#A6E3DD'],Church:['#B597E0','#251B40','#D9C8F2'],Golf:['#9BBE74','#1B2A17','#CDE3B4'],Work:['#E39169','#33190F','#F4C4AC'],Neighbors:['#E487A5','#35152A','#F4BDD0']};
const ppl=[['B',[['Anna Bauer','Acme Co',['Family']],['Ben Carter','555-0111',['Family','School']]]],['D',[['Chloe Diaz','555-0112',['School']],['David Evans','Acme Co',['Church']]]],['F',[['Ella Fischer','555-0114',['Church','Neighbors']],['Frank Garcia','555-0115',[]]]],['H',[['Grace Hill','555-0116',['Work']],['Henry Ito','Acme Co',['Work','Golf','Family']]]]];
for(const dark of [false,true]){const T=dark?darkT:tags;
let h=`<div class="t ${dark?'dark':''}"><div class="top"><div class="row1"><div class="logo"></div><h1>Contacts</h1><span class="sel">Select</span><span class="plus">+</span></div><div class="search">Search</div><div class="chips">`;
h+=`<span class="chip">All 14</span>`;
['Family','School','Church','Golf'].forEach((t,i)=>{const[c,ti,ink]=T[t];h+=`<span class="chip ${i==1?'on':''}" style="--tint:${ti};--tink:${ink}"><i style="background:${c}"></i>${t}</span>`});
h+=`<span class="chip">More…</span></div></div>`;
for(const[l,ps]of ppl){h+=`<div class="letter">${l}</div><div class="group">`;for(const[n,m,ts]of ps){h+=`<div class="r"><div class="av">${n.split(' ').map(x=>x[0]).join('')}</div><div><div class="nm">${n}</div><div class="mt">${m}</div></div><div class="dots">${ts.map(t=>`<i style="background:${T[t][0]}"></i>`).join('')}</div></div>`}h+=`</div>`}
h+=`<div class="tabs"><div class="tab on"><b></b>Contacts</div><div class="tab"><b></b>Lists</div><div class="tab"><b></b>Tags</div><div class="tab"><b></b>Settings</div></div></div>`;
document.body.insertAdjacentHTML('beforeend',h)}
</script></body></html>
