# Builds the React app on every push to main and publishes the static
# files to the `deploy` branch. Hostinger's Git deploy points at `deploy`.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build
        working-directory: app
        env:
          # Cloud sync + Canopy connection (shared Supabase project). Set under
          # Settings → Secrets and variables → Actions → Variables. Both are public values.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
          cp ../privacy.html dist/privacy.html

      # Adds a normal commit on top of the deploy branch (never rewrites it), so
      # Hostinger's Git deploy can keep pulling updates.
      - name: Publish to deploy branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" deploy >/dev/null; then
            git clone -q --depth 1 --branch deploy "$REMOTE" publish
          else
            git init -q -b deploy publish
          fi
          # Replace the site files with the new build; keep the branch's history.
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a app/dist/. publish/
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -q -m "Build ${GITHUB_SHA::7} from main"
          git push -q "$REMOTE" HEAD:deploy
